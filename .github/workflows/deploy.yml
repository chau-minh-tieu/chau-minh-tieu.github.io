# Deploys the site to GitHub Pages on every push to main, that is, every
# merged pull request.
#   build   the same checks as `verify`, then dist/ becomes the Pages artifact
#   deploy  publishes exactly that artifact through the github-pages
#           environment, which only main may use (Setup Guide B2)
#   smoke   waits until the live site serves this commit, then checks it
# https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
name: Deploy

on:
  push:
    branches: [main]
  # Manual re-deploy from the Actions tab. Runs started on another branch
  # build but never deploy.
  workflow_dispatch:

# Workflow default: read-only token. Jobs repeat or narrow it explicitly.
permissions:
  contents: read

# One run at a time for the whole workflow. A running deploy is never
# cancelled, and a newer push replaces a waiting run, so the last merge always
# deploys last. Grouping only the deploy job would let an older build that
# finished late overwrite a newer deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node, pnpm and dependencies; shared with the verify job of pr.yml.
      - uses: ./.github/actions/setup

      # A squash merge can produce a commit no PR has tested (a branch that was
      # behind main), so the site only gets a commit that passes on its own.
      - name: Typecheck
        run: pnpm check

      # GITHUB_SHA becomes /version.txt (src/pages/version.txt.ts).
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # Packs dist/ into a tar file and uploads it as the artifact
      # `github-pages`, kept for one day. Dotfiles are left out; Astro writes none.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    name: deploy
    needs: build
    # The environment's branch policy already refuses other branches; this
    # skips the job instead of failing it.
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    # The only job that can publish, and it runs no repository code: no
    # checkout, no install, only GitHub's deploy action.
    permissions:
      pages: write # create the Pages deployment
      id-token: write # request the OIDC token that proves which workflow and branch deploys
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    name: smoke
    needs: deploy
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # The script uses only Node built-ins: no install step. Values reach it
      # through env, never interpolated into the script.
      - name: Check the live site
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_VERSION: ${{ github.sha }}
        run: node scripts/smoke.ts "$SITE_URL" --version "$EXPECTED_VERSION"
